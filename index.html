<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sick Day Clinic — Dr. Hugo Holm</title>
<link rel="stylesheet" href="styles.css?v=37">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🤒</text></svg>">
</head>
<body>
<div class="bg" aria-hidden="true">
  <img class="blink" src="assets/doc-blinking.gif" alt="">
  <img class="type" src="assets/doc-type.gif" alt="">
</div>
<div class="grain" aria-hidden="true"></div>

<!-- ── the corridor: scroll the door open ───────────────── -->
<div id="intro" class="intro">
  <div class="intro-scroll" id="introScroll" tabindex="-1" role="region"
       aria-label="Opening. Scroll to enter the clinic, or press Escape to skip.">
    <div class="intro-track">
      <div class="intro-stage">
        <video id="introVid" muted playsinline preload="auto"
               poster="assets/door-open-poster.jpg" aria-hidden="true"></video>
        <div class="intro-cta">
          <span class="cta-card">Scroll down<br>to see the doctor</span>
          <svg class="cta-arrow" width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
            <path d="M5 9l10 10L25 9" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
          </svg>
        </div>
        <button id="introSkip" class="intro-skip" type="button">Skip the corridor →</button>
      </div>
    </div>
  </div>
</div>

<!-- ── consult room ─────────────────────────────────────── -->
<section id="scene" class="scene">
  <div class="plate">
    <span class="plate-clinic" id="plateClinic">HOLM FAMILY PRACTICE</span>
    <span class="plate-sub">Suite 0 · walk-ins tolerated</span>
  </div>

  <div class="consult">
    <div class="dialogue">
      <div class="nametag"><span id="docName">Dr. Hugo Holm</span><em id="docTitle">M.D., family practice</em></div>
      <p id="say" class="say"></p>
      <div id="ui" class="ui"></div>
      <button id="back" class="back" hidden aria-label="back">←<span class="bktx"> back</span></button>
    </div>
    <div id="calpop" class="calpop" hidden></div>
  </div>
  <p class="disclaimer"><span>A joke. Not medical advice,</span> <span>not a real document, not your alibi.</span></p>
</section>

<!-- ── the paperwork ────────────────────────────────────── -->
<section id="result" class="result" hidden>
  <div class="panel">
    <header class="ptabs">
      <span class="ptitle" id="ptitle">Your paperwork</span>
      <span class="spacer"></span>
      <button class="tool" id="copy">Copy plan</button>
      <button class="tool" id="print">Print note</button>
      <button class="tool" id="again">New date</button>
    </header>
    <div class="sheet" id="sheet"></div>
  </div>
</section>

<script src="intro.js?v=1"></script>
<script src="app.js?v=38"></script>
</body>
</html>
